<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Пример простой страницы html</title>
</head>
<body>
    <h1>Я НЕРЕАЛЬНО КРУТ И МОЙ РЕСПЕКТ БЕЗ МЕРЫ :)</h1>
    <button onclick="getValue()">Получить значение</button>

    <script>
        async function getValue() {
            const response = await fetch('/api/get-value');
            const data = await response.json();
            alert(data.значение);
        }
    </script>
</body>
</html>
